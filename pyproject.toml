[project]
name = "govuk-ai-accelerator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a2wsgi>=1.10.10",
    "beautifulsoup4==4.15.0",
    "boto3==1.42.42",
    "faiss-cpu>=1.7.4",
    "flask==3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy==3.1.1",
    "humanize==4.16.0",
    "psycopg[binary]==3.3.6",
    "markdownify>=0.14.1",
    "pytest==9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests==2.34.2",
    "s3fs==2026.9.0",
    "starlette>=0.52.1",
    "taxonomy-ontology-accelerator",
    "uvicorn==0.54.0",
    "waitress==3.0.2",
]

[tool.uv.sources]
taxonomy-ontology-accelerator = { path = "lib/taxonomy_ontology_accelerator-2.0.12-py3-none-any.whl" }

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
]
ignore = []
exclude = [
    "tests/**/*.py",       # Ignore all files in the tests directory. TODO: consider removing this once tests are fixed.
    "migrations/**/*.py",  # Ignore all files in the migrations directory. TODO: consider removing this once migrations are fixed.
]

[tool.ruff.format]
quote-style = "double"

[tool.commitizen]
name = "cz_customize"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
template = ".changelog.j2"

[tool.commitizen.customize]
commit_parser = "^(?P<change_type>feat|fix|refactor|docs|tests|chore|build)(\\((?P<scope>[^\\)]+)\\))?:\\s(?P<message>.*)$"
changelog_pattern = "^(feat|fix|refactor|docs|tests|chore|build)"
change_type_map = { "feat" = "Features", "fix" = "Bug Fixes", "refactor" = "Refactoring", "docs" = "Documentation", "tests" = "Tests", "chore" = "Chores", "build" = "Builds" }
change_type_order = ["BREAKING CHANGE", "Features", "Bug Fixes", "Documentation", "Refactoring", "Tests", "Chores", "Builds"]