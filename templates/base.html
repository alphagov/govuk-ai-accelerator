<!DOCTYPE html>
<html>
  <head>
    <title>S3 Browser</title>
    <!-- Compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      .container {
        margin-top: 20px;
      }
      .nav-link {
          font-size: 2.2rem;
          display: block;
          margin-bottom: 10px;
      }
      body { font-family: sans-serif; margin: 2rem auto; padding: 0 1rem; }
      h1 { color: #0b0c0c; font-size: 2rem; margin-bottom: 1rem;}
      form { background: #f3f2f1; padding: 2rem; border-radius: 4px; }
      label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
      input[type="text"] { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 2px solid #0b0c0c; }
      input[type="file"] { margin-bottom: 1rem; }
      button { padding: 0.5rem 1rem; background: #00703c; color: white; border: none; cursor: pointer; font-size: 1rem; font-weight: bold; box-shadow: 0 2px 0 #002d18; }
      button:hover { background: #005a30; }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-wrapper blue">
        <a href="/" class="brand-logo center">Accelerator</a>
      </div>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  </body>
</html>
