{% extends "base.html" %}

{% block content %}
<style>
  body,
  body.govuk-template--rebranded {
      background-color: #ffffff;
  }

  main {
      padding: 24px 0;
      display: block;
      max-width: 960px;
  }

  .content-area {
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
  }

  .review-jobs-page {
      background: #ffffff;
  }
</style>

<div class="review-jobs-page govuk-width-container">
  <div class="review-jobs-header">
    <div>
      <h2>{{ review_page_title }}</h2>
      <p>{{ review_page_description }}</p>
    </div>
  </div>

  <div class="review-search-bar">
    <label class="govuk-label govuk-visually-hidden" for="jobs-search">Search historical jobs</label>
    <div class="review-search-input-wrapper">
      <i class="material-icons" aria-hidden="true">search</i>
      <input class="govuk-input review-search-input" id="jobs-search" type="search" placeholder="Search ontology, domain, status, or type...">
    </div>
  </div>

  <div class="review-table-container">
    <table class="review-jobs-table" id="jobs-table">
      <caption class="govuk-visually-hidden">Historical jobs</caption>
      <thead>
        <tr>
          <th scope="col" aria-sort="none">
            <button type="button" class="review-sort-button" data-sort-key="ontology">
              <span>Ontology</span>
            </button>
          </th>
          <th scope="col" aria-sort="none">
            <button type="button" class="review-sort-button" data-sort-key="domain">
              <span>Domain</span>
            </button>
          </th>
          <th scope="col" aria-sort="descending">
            <button type="button" class="review-sort-button" data-sort-key="created_at">
              <span>Created At</span>
            </button>
          </th>
          <th scope="col" aria-sort="none">
            <button type="button" class="review-sort-button" data-sort-key="status">
              <span>Status</span>
            </button>
          </th>
          <th scope="col" aria-sort="none">
            <button type="button" class="review-sort-button" data-sort-key="type">
              <span>Type</span>
            </button>
          </th>
          <th scope="col"><span>Actions</span></th>
        </tr>
      </thead>
      <tbody id="jobs-tbody">
        <tr><td colspan="6" class="review-table-empty">Loading jobs...</td></tr>
      </tbody>
    </table>
  </div>

  <nav class="govuk-pagination review-pagination" id="review-pagination" aria-label="Pagination"></nav>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const REVIEW_JOB_TYPE = {{ review_job_type|tojson }};
    const REVIEW_PAGE_TITLE = {{ review_page_title|tojson }};
    const jobsTbody = document.getElementById('jobs-tbody');
    const jobsSearch = document.getElementById('jobs-search');
    const paginationContainer = document.getElementById('review-pagination');
    const sortButtons = document.querySelectorAll('.review-sort-button');

    let currentPage = 1;
    const perPage = 10;
    let sortKey = 'created_at';
    let sortDirection = 'desc';
    let selectedJobId = null;
    let selectedDetailSection = 'ontology-files';
    let currentJobs = [];
    let currentPagination = null;
    const selectedJobState = {};

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function formatDateTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString('en-GB', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'Europe/London'
      });
    }

    function jobStatusLabel(job) {
      const status = String(job.status || 'pending').toLowerCase();
      if (status === 'completed') return 'Created';
      return status.charAt(0).toUpperCase() + status.slice(1);
    }

    function pipelineTypeLabel(pipeline) {
      if (pipeline === 'ingestion') return 'ingestion';
      if (pipeline === 'ontology-harness') return 'test';
      return 'ontology';
    }

    function statusTagModifier(status) {
      if (status === 'completed') return 'green';
      if (status === 'failed') return 'red';
      if (status === 'running') return 'blue';
      if (status === 'pending') return 'yellow';
      if (status === 'stopped') return 'grey';
      return 'grey';
    }

    function pipelineTagModifier(pipeline) {
      if (pipeline === 'ingestion') return 'turquoise';
      if (pipeline === 'ontology-harness') return 'purple';
      return 'yellow';
    }

    function shortenText(value, maxLength = 42) {
      const text = String(value || '');
      if (text.length <= maxLength) return text;
      const prefixLength = Math.max(12, Math.floor((maxLength - 1) * 0.58));
      const suffixLength = Math.max(8, maxLength - prefixLength - 1);
      return `${text.slice(0, prefixLength)}...${text.slice(-suffixLength)}`;
    }

    function formatOntologyLabel(job) {
      return job.job_runs || shortenText(job.job_id, 46);
    }

    function formatJobIdLabel(jobId) {
      return shortenText(jobId, 34);
    }

    function emptyArtifactGroups() {
      return { ontology_files: [], intermediary_files: [], reports: [] };
    }

    function detailState(jobId) {
      if (!selectedJobState[jobId]) {
        selectedJobState[jobId] = {
          artifacts: { groups: emptyArtifactGroups() },
          notes: [],
          editingNoteId: null,
          loading: false,
          error: ''
        };
      }
      return selectedJobState[jobId];
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      const payload = response.status === 204 ? null : await response.json();
      if (!response.ok) {
        throw new Error((payload && payload.error) || 'Request failed');
      }
      return payload;
    }

    async function fetchReviewJobs() {
      const url = new URL("{{ url_for('ontology.review_jobs') }}", window.location.origin);
      url.searchParams.set('type', REVIEW_JOB_TYPE);
      url.searchParams.set('page', currentPage);
      url.searchParams.set('per_page', perPage);
      url.searchParams.set('sort', sortKey);
      url.searchParams.set('direction', sortDirection);
      const search = jobsSearch.value.trim();
      if (search) url.searchParams.set('search', search);

      try {
        const payload = await fetchJson(url);
        currentJobs = payload.jobs || [];
        currentPagination = payload.pagination || null;
        if (selectedJobId && !currentJobs.some(job => job.job_id === selectedJobId)) {
          selectedJobId = null;
        }
        renderCurrentJobs();
        renderPagination(currentPagination);
      } catch (err) {
        jobsTbody.innerHTML = `<tr><td colspan="6" class="review-table-empty red-text">Error fetching jobs: ${escapeHtml(err.message)}</td></tr>`;
        paginationContainer.innerHTML = '';
      }
    }

    function renderCurrentJobs() {
      renderJobsTable(currentJobs);
    }

    function updateSortIndicators() {
      sortButtons.forEach(button => {
        const active = button.dataset.sortKey === sortKey;
        const tableHeader = button.closest('th');
        if (tableHeader) {
          tableHeader.setAttribute(
            'aria-sort',
            active ? (sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'
          );
        }
      });
    }

    function renderJobsTable(jobs) {
      updateSortIndicators();

      if (!jobs.length) {
        jobsTbody.innerHTML = '<tr><td colspan="6" class="review-table-empty">No jobs found.</td></tr>';
        return;
      }

      jobsTbody.innerHTML = '';
      jobs.forEach(job => {
        const status = String(job.status || 'pending').toLowerCase();
        const domainStr = job.domain ? String(job.domain) : '-';
        const pipeline = job.pipeline || 'ontology';
        const isSelected = selectedJobId === job.job_id;
        const typeLabel = pipelineTypeLabel(pipeline);
        const notesCount = Number(job.notes_count || 0);
        const notesLabel = notesCount > 0 ? `Notes (${notesCount})` : 'Add note';

        const tr = document.createElement('tr');
        tr.className = `review-job-row${isSelected ? ' is-selected' : ''}`;
        tr.dataset.jobId = job.job_id;
        tr.tabIndex = 0;
        tr.setAttribute('aria-expanded', isSelected ? 'true' : 'false');
        tr.innerHTML = `
          <td>
            <span class="review-job-label" title="${escapeAttribute(job.job_runs || job.job_id)}">
              <strong>${escapeHtml(formatOntologyLabel(job))}</strong>
              <span class="review-job-id" title="${escapeAttribute(job.job_id)}">${escapeHtml(formatJobIdLabel(job.job_id))}</span>
            </span>
          </td>
          <td>${escapeHtml(domainStr)}</td>
          <td>${formatDateTime(job.created_at)}</td>
          <td>
            <span class="govuk-tag review-tag govuk-tag--${statusTagModifier(status)}">${escapeHtml(jobStatusLabel(job))}</span>
          </td>
          <td>
            <span class="govuk-tag review-tag govuk-tag--${pipelineTagModifier(pipeline)}">${escapeHtml(typeLabel)}</span>
          </td>
          <td>
            ${renderJobActions(job, notesLabel)}
          </td>
        `;
        jobsTbody.appendChild(tr);

        if (isSelected) {
          const detailTr = document.createElement('tr');
          detailTr.className = 'review-detail-row';
          detailTr.innerHTML = `<td colspan="6">${renderJobDetail(job)}</td>`;
          jobsTbody.appendChild(detailTr);
        }
      });
    }

    function renderJobActions(job, notesLabel) {
      const actions = [];
      if (job.visualize_url) {
        actions.push(`
          <li class="review-row-actions__item">
            <a class="govuk-button govuk-button--secondary review-row-action-button visualise-job-action" href="${escapeAttribute(job.visualize_url)}" target="_blank" rel="noopener noreferrer">
              Visualise<span class="govuk-visually-hidden"> ${escapeHtml(job.job_id)}</span>
            </a>
          </li>
        `);
      }
      actions.push(`
        <li class="review-row-actions__item">
          <button type="button" class="govuk-button govuk-button--secondary review-row-action-button open-notes-action" data-job-id="${escapeAttribute(job.job_id)}" aria-label="${escapeAttribute(notesLabel)} for this job">
            ${escapeHtml(notesLabel)}
          </button>
        </li>
      `);
      if (job.ontology_download_url) {
        actions.push(`
          <li class="review-row-actions__item">
            <a class="govuk-button govuk-button--secondary review-row-action-button download-ontology-action" href="${escapeAttribute(job.ontology_download_url)}" download aria-label="Download ontology ${escapeAttribute(job.job_id)}">
              Download<span class="govuk-visually-hidden"> ontology ${escapeHtml(job.job_id)}</span>
            </a>
          </li>
        `);
      }
      return `
        <ul class="review-row-actions" aria-label="Actions for ${escapeAttribute(job.job_id)}">
          ${actions.join('')}
        </ul>
      `;
    }

    function renderPagination(pagination) {
      if (!pagination || pagination.total_pages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      const totalPages = pagination.total_pages;
      const startPage = Math.floor((pagination.page - 1) / 10) * 10 + 1;
      const endPage = Math.min(startPage + 9, totalPages);
      let pageButtons = '';

      for (let pageNumber = startPage; pageNumber <= endPage; pageNumber += 1) {
        const current = pageNumber === pagination.page;
        pageButtons += `
          <li class="govuk-pagination__item${current ? ' govuk-pagination__item--current' : ''}">
            <a class="govuk-link govuk-pagination__link" href="#" data-page="${pageNumber}" aria-label="Page ${pageNumber}" ${current ? 'aria-current="page"' : ''}>
              ${pageNumber}
            </a>
          </li>
        `;
      }

      paginationContainer.innerHTML = `
        ${pagination.has_previous ? `
          <div class="govuk-pagination__prev">
            <a class="govuk-link govuk-pagination__link" href="#" rel="prev" data-page="${pagination.page - 1}">
              <svg class="govuk-pagination__icon govuk-pagination__icon--prev" xmlns="http://www.w3.org/2000/svg" height="13" width="15" aria-hidden="true" focusable="false" viewBox="0 0 15 13">
                <path d="m6.5938-0.0078125-6.7266 6.7266 6.7441 6.4062 1.377-1.449-4.1856-3.9768h12.896v-2h-12.984l4.2931-4.293-1.414-1.414z"></path>
              </svg>
              <span class="govuk-pagination__link-title">Previous<span class="govuk-visually-hidden"> page</span></span>
            </a>
          </div>
        ` : ''}
        <ul class="govuk-pagination__list">
          ${pageButtons}
        </ul>
        ${pagination.has_next ? `
          <div class="govuk-pagination__next">
            <a class="govuk-link govuk-pagination__link" href="#" rel="next" data-page="${pagination.page + 1}">
              <span class="govuk-pagination__link-title">Next<span class="govuk-visually-hidden"> page</span></span>
              <svg class="govuk-pagination__icon govuk-pagination__icon--next" xmlns="http://www.w3.org/2000/svg" height="13" width="15" aria-hidden="true" focusable="false" viewBox="0 0 15 13">
                <path d="m8.107-0.0078125-1.4136 1.414 4.2926 4.293h-12.986v2h12.896l-4.1855 3.9766 1.377 1.4492 6.7441-6.4062-6.7246-6.7266z"></path>
              </svg>
            </a>
          </div>
        ` : ''}
      `;
    }

    function renderJobDetail(job) {
      const state = detailState(job.job_id);
      const groups = (state.artifacts && state.artifacts.groups) || emptyArtifactGroups();
      return `
        <div class="review-job-detail">
          <div class="review-detail-menu" aria-label="Selected job menu">
            ${renderDetailTab('ontology-files', 'Ontology Files')}
            ${renderDetailTab('intermediary-files', 'Intermediary Files')}
            ${renderDetailTab('reports', 'Reports')}
            ${renderDetailTab('notes', 'Notes')}
          </div>
          <div class="review-detail-panel">
            ${state.loading ? '<p class="review-empty-state">Loading job details...</p>' : ''}
            ${state.error ? `<p class="review-empty-state red-text">${escapeHtml(state.error)}</p>` : ''}
            ${!state.loading && selectedDetailSection === 'notes'
              ? renderInlineNotes(job, state.notes || [], state.editingNoteId)
              : !state.loading && selectedDetailSection === 'reports'
                ? renderArtifactSection('Reports', groups.reports)
              : !state.loading && selectedDetailSection === 'intermediary-files'
                ? renderArtifactSection('Intermediary Files', groups.intermediary_files)
                : !state.loading
                  ? renderArtifactSection('Ontology Files', groups.ontology_files)
                  : ''}
          </div>
        </div>
      `;
    }

    function renderDetailTab(section, label) {
      const active = selectedDetailSection === section;
      return `
        <button type="button" class="review-detail-tab${active ? ' is-active' : ''}" data-detail-section="${section}">
          ${label}
        </button>
      `;
    }

    function renderArtifactSection(title, artifacts) {
      return `
        <div class="review-detail-content">
          <h3>${escapeHtml(title)}</h3>
          ${renderArtifactRows(artifacts || [])}
        </div>
      `;
    }

    function renderArtifactRows(artifacts) {
      if (!artifacts.length) {
        return '<p class="review-empty-state">No downloadable files are available for this section.</p>';
      }
      return `
        <div class="review-artifact-list">
          ${artifacts.map(artifact => `
            <div class="review-artifact-row">
              <span class="review-artifact-name">
                <i class="material-icons" aria-hidden="true">${artifact.kind === 'folder' ? 'folder_zip' : 'insert_drive_file'}</i>
                <span>${escapeHtml(artifact.name)}</span>
              </span>
              ${renderArtifactActions(artifact)}
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderArtifactActions(artifact) {
      const actions = [];
      if (artifact.visualize_url) {
        actions.push(`
          <li class="review-artifact-actions__item">
            <a class="govuk-link review-artifact-action-link" href="${escapeAttribute(artifact.visualize_url)}">
              Visualise graph
            </a>
          </li>
        `);
      }
      actions.push(`
        <li class="review-artifact-actions__item">
          <a class="govuk-link review-artifact-action-link" href="${escapeAttribute(artifact.download_url)}" download aria-label="${escapeAttribute(artifact.download_label || 'Download')} ${escapeAttribute(artifact.name)}">
            ${escapeHtml(artifact.download_label || 'Download')}
          </a>
        </li>
      `);
      return `
        <ul class="review-artifact-actions" aria-label="Actions for ${escapeAttribute(artifact.name)}">
          ${actions.join('')}
        </ul>
      `;
    }

    function renderInlineNotes(job, notes, editingNoteId) {
      return `
        <div class="review-detail-content">
          <h3>Notes</h3>
          <div class="review-inline-notes">
            ${notes.length ? notes.map(note => renderNoteItem(job.job_id, note, editingNoteId)).join('') : '<p class="review-empty-state">No notes recorded for this run.</p>'}
          </div>
          <div class="review-inline-note-form">
            <label for="new-note-${escapeAttribute(job.job_id)}" class="govuk-label govuk-label--s">Add a note</label>
            <textarea id="new-note-${escapeAttribute(job.job_id)}" class="govuk-textarea review-note-textarea" rows="4"></textarea>
            <button type="button" class="govuk-button review-add-note-button add-inline-note-action" data-job-id="${escapeAttribute(job.job_id)}">
              Add note
            </button>
          </div>
        </div>
      `;
    }

    function renderNoteItem(jobId, note, editingNoteId) {
      const isEditing = String(editingNoteId || '') === String(note.id);
      if (isEditing) {
        return `
          <div class="review-note-item">
            <label class="govuk-visually-hidden" for="edit-note-${note.id}">Edit note</label>
            <textarea id="edit-note-${note.id}" class="govuk-textarea review-note-textarea" rows="3">${escapeHtml(note.text)}</textarea>
            <div class="review-note-item__actions">
              <button type="button" class="review-note-icon-button save-inline-note-action" data-job-id="${escapeAttribute(jobId)}" data-note-id="${note.id}" aria-label="Save note">
                <i class="material-icons" aria-hidden="true">check</i>
              </button>
              <button type="button" class="review-note-icon-button cancel-inline-note-action" data-job-id="${escapeAttribute(jobId)}" aria-label="Cancel edit">
                <i class="material-icons" aria-hidden="true">close</i>
              </button>
            </div>
          </div>
        `;
      }

      return `
        <div class="review-note-item">
          <div class="review-note-item__meta">${formatDateTime(note.created_at)}</div>
          <div class="review-note-item__text">${escapeHtml(note.text)}</div>
          <div class="review-note-item__actions">
            <button type="button" class="review-note-icon-button edit-inline-note-action" data-job-id="${escapeAttribute(jobId)}" data-note-id="${note.id}" aria-label="Edit note">
              <i class="material-icons" aria-hidden="true">edit</i>
            </button>
            <button type="button" class="review-note-icon-button review-note-icon-button--danger delete-inline-note-action" data-job-id="${escapeAttribute(jobId)}" data-note-id="${note.id}" aria-label="Delete note">
              <i class="material-icons" aria-hidden="true">delete</i>
            </button>
          </div>
        </div>
      `;
    }

    async function loadSelectedJobData(jobId) {
      const state = detailState(jobId);
      state.loading = true;
      state.error = '';
      renderCurrentJobs();
      try {
        const [artifacts, notes] = await Promise.all([
          fetchJson(`/ontology/jobs/${encodeURIComponent(jobId)}/artifacts`),
          fetchJson(`/ontology/jobs/${encodeURIComponent(jobId)}/notes`)
        ]);
        state.artifacts = artifacts;
        state.notes = notes || [];
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        renderCurrentJobs();
      }
    }

    async function refreshSelectedJob(jobId) {
      const state = detailState(jobId);
      try {
        const [artifacts, notes] = await Promise.all([
          fetchJson(`/ontology/jobs/${encodeURIComponent(jobId)}/artifacts`),
          fetchJson(`/ontology/jobs/${encodeURIComponent(jobId)}/notes`)
        ]);
        state.artifacts = artifacts;
        state.notes = notes || [];
        state.editingNoteId = null;
        await fetchReviewJobs();
      } catch (err) {
        state.error = err.message;
        renderCurrentJobs();
      }
    }

    jobsTbody.addEventListener('click', async event => {
      const tabButton = event.target.closest('.review-detail-tab');
      if (tabButton) {
        selectedDetailSection = tabButton.dataset.detailSection;
        renderCurrentJobs();
        return;
      }

      const openNotesButton = event.target.closest('.open-notes-action');
      if (openNotesButton) {
        selectedJobId = openNotesButton.dataset.jobId;
        selectedDetailSection = 'notes';
        loadSelectedJobData(selectedJobId);
        return;
      }

      if (event.target.closest('a.review-row-action-button')) {
        return;
      }

      const addNoteButton = event.target.closest('.add-inline-note-action');
      if (addNoteButton) {
        const jobId = addNoteButton.dataset.jobId;
        const textarea = document.getElementById(`new-note-${jobId}`);
        const text = textarea ? textarea.value.trim() : '';
        if (!text) return;
        await fetchJson(`/ontology/jobs/${encodeURIComponent(jobId)}/notes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (textarea) textarea.value = '';
        await refreshSelectedJob(jobId);
        return;
      }

      const editNoteButton = event.target.closest('.edit-inline-note-action');
      if (editNoteButton) {
        const state = detailState(editNoteButton.dataset.jobId);
        state.editingNoteId = editNoteButton.dataset.noteId;
        renderCurrentJobs();
        return;
      }

      const cancelNoteButton = event.target.closest('.cancel-inline-note-action');
      if (cancelNoteButton) {
        const state = detailState(cancelNoteButton.dataset.jobId);
        state.editingNoteId = null;
        renderCurrentJobs();
        return;
      }

      const saveNoteButton = event.target.closest('.save-inline-note-action');
      if (saveNoteButton) {
        const jobId = saveNoteButton.dataset.jobId;
        const noteId = saveNoteButton.dataset.noteId;
        const textarea = document.getElementById(`edit-note-${noteId}`);
        const text = textarea ? textarea.value.trim() : '';
        if (!text) return;
        await fetchJson(`/ontology/jobs/${encodeURIComponent(jobId)}/notes/${noteId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        await refreshSelectedJob(jobId);
        return;
      }

      const deleteNoteButton = event.target.closest('.delete-inline-note-action');
      if (deleteNoteButton) {
        const jobId = deleteNoteButton.dataset.jobId;
        await fetch(`/ontology/jobs/${encodeURIComponent(jobId)}/notes/${deleteNoteButton.dataset.noteId}`, {
          method: 'DELETE'
        });
        await refreshSelectedJob(jobId);
        return;
      }

      const jobRow = event.target.closest('.review-job-row');
      if (jobRow) {
        selectedJobId = selectedJobId === jobRow.dataset.jobId ? null : jobRow.dataset.jobId;
        selectedDetailSection = 'ontology-files';
        renderCurrentJobs();
        if (selectedJobId) loadSelectedJobData(selectedJobId);
      }
    });

    jobsTbody.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const jobRow = event.target.closest('.review-job-row');
      if (!jobRow) return;

      event.preventDefault();
      selectedJobId = selectedJobId === jobRow.dataset.jobId ? null : jobRow.dataset.jobId;
      selectedDetailSection = 'ontology-files';
      renderCurrentJobs();
      if (selectedJobId) loadSelectedJobData(selectedJobId);
    });

    sortButtons.forEach(button => {
      button.addEventListener('click', () => {
        const nextSortKey = button.dataset.sortKey;
        if (sortKey === nextSortKey) {
          sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = nextSortKey;
          sortDirection = nextSortKey === 'created_at' ? 'desc' : 'asc';
        }
        currentPage = 1;
        fetchReviewJobs();
      });
    });

    paginationContainer.addEventListener('click', event => {
      const link = event.target.closest('[data-page]');
      if (!link) return;
      event.preventDefault();
      currentPage = Number(link.dataset.page);
      fetchReviewJobs();
    });

    jobsSearch.addEventListener('input', () => {
      currentPage = 1;
      fetchReviewJobs();
    });

    fetchReviewJobs();
  });
