{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col s12">
    <div class="card">
      <div class="card-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <span class="card-title" style="font-weight: bold; margin: 0; color: #1d70b8;">Historical Jobs</span>
          <button id="refresh-jobs-btn" class="btn-flat waves-effect waves-teal" style="padding: 0 10px;">
            <i class="material-icons">refresh</i>
          </button>
        </div>
        
        <p class="grey-text text-darken-1" style="margin-bottom: 20px;">
          View all historical pipeline processing jobs and their current status.
        </p>

        <table class="striped highlight responsive-table" id="jobs-table">
          <caption class="govuk-visually-hidden">Historical jobs</caption>
          <thead>
            <tr>
                <th scope="col" style="width: 50px;">#</th>
                <th scope="col">Job ID</th>
                <th scope="col">Created</th>
                <th scope="col">Status</th>
                <th scope="col">Pipeline</th>
                <th scope="col">Domain</th>
                <th scope="col">TTL File</th>
                <th scope="col">Output</th>
                <th scope="col">Visualise</th>
                <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="jobs-tbody">
            <tr><td colspan="10" class="center-align grey-text">Loading jobs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const jobsTbody = document.getElementById('jobs-tbody');
    const refreshBtn = document.getElementById('refresh-jobs-btn');

    async function fetchJobs() {
      refreshBtn.classList.add('disabled');
      try {
        const response = await fetch("{{ url_for('ontology.list_jobs') }}");
        if (!response.ok) throw new Error("Failed to fetch jobs");
        const jobs = await response.json();
        renderJobsTable(jobs);
      } catch (err) {
        console.error(err);
        jobsTbody.innerHTML = `<tr><td colspan="10" class="center-align red-text">Error fetching jobs: ${err.message}</td></tr>`;
      } finally {
        refreshBtn.classList.remove('disabled');
      }
    }

    function renderJobsTable(jobs) {
      if (!jobs || jobs.length === 0) {
        jobsTbody.innerHTML = '<tr><td colspan="10" class="center-align grey-text">No jobs found.</td></tr>';
        return;
      }

      jobsTbody.innerHTML = '';
      jobs.forEach((job, index) => {
        const tr = document.createElement('tr');
        
        let statusHtml = '';
        if (job.status.toLowerCase() === 'completed') {
          statusHtml = '<span class="new badge green" data-badge-caption="done"></span>';
        } else if (job.status.toLowerCase() === 'failed') {
          statusHtml = `<span class="new badge red" data-badge-caption="failed"></span> <i class="material-icons tiny grey-text tooltipped" data-position="bottom" data-tooltip="${job.error || 'Unknown error'}">info_outline</i>`;
        } else if (job.status.toLowerCase() === 'running') {
          statusHtml = '<span class="new badge blue" data-badge-caption="running"></span>';
        } else {
          statusHtml = '<span class="new badge orange" data-badge-caption="pending"></span>';
        }

        const domainStr = job.domain ? job.domain : '-';
        const pipeline = job.pipeline || 'ontology';
        const isIngestion = pipeline === 'ingestion';
        const pipelineBadge = isIngestion
          ? '<span class="new badge teal lighten-2" data-badge-caption="ingestion"></span>'
          : '<span class="new badge indigo lighten-1" data-badge-caption="ontology"></span>';

        let ttlLink = 'N/A';
        let outputLink = 'N/A';
        let visualiserLink = 'N/A';
        let actionsHtml = 'N/A';

        if (!isIngestion) {
          const targetBucket = 'govuk-ai-accelerator-data-integration';
          if (job.status.toLowerCase() === 'completed' && job.job_runs) {
              outputLink = `<a href="/viewer/bucket/${targetBucket}/${domainStr}/${job.job_runs}/" class="btn-view">Browse Files</a>`;
              ttlLink = `<a href="/viewer/bucket/download/buckets/${targetBucket}/${domainStr}/${job.job_runs}/output/ontology.ttl" class="blue-text" target="_blank">Download</a>`;
              visualiserLink = `<a href="/visualizer/?run=${domainStr}/${job.job_runs}" class="btn-view">Visualise Graph</a>`;
          }
        }

        if (['pending', 'running'].includes(job.status.toLowerCase())) {
          actionsHtml = `<button type="button" class="table-action-link stop-job-action" data-job-id="${job.job_id}">Stop<span class="govuk-visually-hidden"> job ${job.job_id}</span></button>`;
        }

        tr.innerHTML = `
          <td class="grey-text">${index + 1}</td>
          <td style="font-family: monospace; font-size: 0.9em;">${job.job_id}</td>
          <td>${new Date(job.created_at).toLocaleString('en-GB', { timeZone: 'Europe/London' })}</td>
          <td>${statusHtml}</td>
          <td>${pipelineBadge}</td>
          <td>${domainStr}</td>
          <td>${ttlLink}</td>
          <td>${outputLink}</td>
          <td>${visualiserLink}</td>
          <td>${actionsHtml}</td>
        `;
        jobsTbody.appendChild(tr);
      });
      M.Tooltip.init(document.querySelectorAll('.tooltipped'));
    }

    async function stopJob(jobId, button) {
      if (!window.confirm(`Stop job ${jobId}?`)) return;

      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
      button.innerHTML = `Stopping<span class="govuk-visually-hidden"> job ${jobId}</span>`;

      try {
        const response = await fetch(`/ontology/jobs/${jobId}/stop`, { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || 'Failed to stop job');
        }
        M.toast({ html: `Job ${jobId} stopped` });
        fetchJobs();
      } catch (err) {
        M.toast({ html: `Could not stop job: ${err.message}` });
        button.disabled = false;
        button.removeAttribute('aria-disabled');
        button.innerHTML = `Stop<span class="govuk-visually-hidden"> job ${jobId}</span>`;
      }
    }

    jobsTbody.addEventListener('click', (event) => {
      const button = event.target.closest('.stop-job-action');
      if (!button) return;
      stopJob(button.dataset.jobId, button);
    });

    refreshBtn.addEventListener('click', fetchJobs);
    fetchJobs();
    setInterval(fetchJobs, 30000); // Slower refresh for historical view
  });
</script>
<style>
  .btn-view {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      font-size: 0.9rem;
      border-radius: 4px;
      background-color: #1d70b8;
      color: white;
      transition: background-color 0.3s ease;
      text-align: center;
      line-height: normal;
  }
  .btn-view:hover {
      background-color: #005a30;
      color: white;
  }
</style>
{% endblock %}
