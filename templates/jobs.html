{% extends "base.html" %}

{% block content %}
<style>
  body,
  body.govuk-template--rebranded {
      background-color: #ffffff;
  }

  main {
      padding: 24px 0;
      display: block;
      max-width: 960px;
  }

  .content-area {
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
  }

  .review-jobs-page {
      background: #ffffff;
  }
</style>

<div class="review-jobs-page govuk-width-container">
  <div class="review-jobs-header">
    <div>
      <h2>Review Ontologies</h2>
      <p>View historical ontology runs, generated artefacts, and review notes.</p>
    </div>
    <button id="refresh-jobs-btn" class="review-icon-button tooltipped" data-position="left" data-tooltip="Refresh jobs" type="button" aria-label="Refresh jobs">
      <i class="material-icons" aria-hidden="true">refresh</i>
    </button>
  </div>

  <div class="review-search-bar">
    <label class="govuk-label govuk-visually-hidden" for="jobs-search">Search historical jobs</label>
    <div class="review-search-input-wrapper">
      <i class="material-icons" aria-hidden="true">search</i>
      <input class="govuk-input review-search-input" id="jobs-search" type="search" placeholder="Search ontology, domain, status, or type...">
    </div>
  </div>

  <div class="review-table-container">
    <table class="review-jobs-table" id="jobs-table">
      <caption class="govuk-visually-hidden">Historical jobs</caption>
      <thead>
        <tr>
          <th scope="col"><span>Ontology</span> <span class="sort-icon-inactive" aria-hidden="true">↕</span></th>
          <th scope="col"><span>Domain</span> <span class="sort-icon-inactive" aria-hidden="true">↕</span></th>
          <th scope="col"><span>Created At</span> <span class="sort-icon-active" aria-hidden="true">▼</span></th>
          <th scope="col"><span>Status</span> <span class="sort-icon-inactive" aria-hidden="true">↕</span></th>
          <th scope="col"><span>Type</span> <span class="sort-icon-inactive" aria-hidden="true">↕</span></th>
          <th scope="col"><span>Actions</span></th>
        </tr>
      </thead>
      <tbody id="jobs-tbody">
        <tr><td colspan="6" class="review-table-empty">Loading jobs...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="notes-modal" class="modal review-notes-modal" role="dialog" aria-modal="true" aria-labelledby="notes-modal-title">
    <div class="modal-content review-notes-modal__content">
        <div class="review-notes-modal__header">
            <h2 class="govuk-heading-l" id="notes-modal-title">Job notes</h2>
            <button type="button" class="modal-close review-modal-close" title="Close" aria-label="Close notes modal">
                <i class="material-icons" aria-hidden="true">close</i>
            </button>
        </div>
        <div id="notes-modal-list" class="review-notes-list"></div>
        <div class="review-notes-form">
            <label for="notes-modal-input" class="govuk-label govuk-label--s">Add a note</label>
            <textarea id="notes-modal-input" class="govuk-textarea review-note-textarea" rows="4" placeholder="Type a note here..."></textarea>
            <button type="button" id="notes-modal-add-btn" class="govuk-button review-add-note-button">
                Add note
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const jobsTbody = document.getElementById('jobs-tbody');
    const refreshBtn = document.getElementById('refresh-jobs-btn');
    const jobsSearch = document.getElementById('jobs-search');
    M.Modal.init(document.getElementById('notes-modal'), { dismissible: true });

    async function fetchJobs() {
      refreshBtn.classList.add('disabled');
      try {
        const response = await fetch("{{ url_for('ontology.list_jobs') }}");
        if (!response.ok) throw new Error("Failed to fetch jobs");
        const jobs = await response.json();
        allJobs = jobs || [];
        renderJobsTable(filterJobs());
      } catch (err) {
        console.error(err);
        jobsTbody.innerHTML = `<tr><td colspan="6" class="review-table-empty red-text">Error fetching jobs: ${err.message}</td></tr>`;
      } finally {
        refreshBtn.classList.remove('disabled');
      }
    }

    let currentEditingJobId = null;
    let selectedJobId = null;
    let selectedDetailSection = 'ontology-files';
    let latestJobs = [];
    let allJobs = [];

    function getJobNotes(jobId) {
      const newNotes = localStorage.getItem('job-notes-' + jobId);
      if (newNotes) {
        try {
          return JSON.parse(newNotes);
        } catch (e) {
          console.error("Error parsing job notes", e);
        }
      }
      const oldNote = localStorage.getItem('job-note-' + jobId);
      if (oldNote) {
        const migrated = [{
          id: 'legacy-' + Date.now(),
          text: oldNote,
          timestamp: new Date().toISOString()
        }];
        localStorage.setItem('job-notes-' + jobId, JSON.stringify(migrated));
        localStorage.removeItem('job-note-' + jobId);
        return migrated;
      }
      return [];
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(String(text || ''));
    }

    function formatDateTime(value) {
      if (!value) return '-';

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';

      return date.toLocaleString('en-GB', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        timeZone: 'Europe/London'
      });
    }

    function jobStatusLabel(job) {
      const status = String(job.status || 'pending').toLowerCase();
      if (status === 'completed') return 'Created';
      return status.charAt(0).toUpperCase() + status.slice(1);
    }

    function pipelineTypeLabel(pipeline) {
      if (pipeline === 'ingestion') return 'ingestion';
      if (pipeline === 'ontology-harness') return 'test';
      return 'ontology';
    }

    function statusTagModifier(status) {
      if (status === 'completed') return 'green';
      if (status === 'failed') return 'red';
      if (status === 'running') return 'blue';
      if (status === 'pending') return 'yellow';
      if (status === 'stopped') return 'grey';
      return 'grey';
    }

    function pipelineTagModifier(pipeline) {
      if (pipeline === 'ingestion') return 'turquoise';
      if (pipeline === 'ontology-harness') return 'purple';
      return 'yellow';
    }

    function filterJobs() {
      const query = (jobsSearch?.value || '').trim().toLowerCase();
      if (!query) return allJobs;

      return allJobs.filter(job => {
        const values = [
          job.job_id,
          job.job_runs,
          job.domain,
          job.status,
          job.pipeline,
          pipelineTypeLabel(job.pipeline)
        ];
        return values.some(value => String(value || '').toLowerCase().includes(query));
      });
    }

    function updateNoteButtons(jobId, notes) {
      const notesCount = notes.length;
      const notesLabel = notesCount > 0 ? `View notes (${notesCount})` : 'Add note';

      document.querySelectorAll(`.edit-note-action[data-job-id="${jobId}"]`).forEach(btn => {
        const inst = M.Tooltip.getInstance(btn);
        if (inst) inst.destroy();

        const countEl = btn.querySelector('.notes-count');
        if (countEl) countEl.textContent = notesLabel;
        btn.classList.toggle('has-notes', notesCount > 0);
        btn.setAttribute('aria-label', `${notesLabel} for this job`);
      });
    }

    async function syncNotesFromS3(jobId) {
      try {
        const response = await fetch(`/ontology/jobs/${jobId}/notes`);
        if (response.ok) {
          const s3Notes = await response.json();
          localStorage.setItem('job-notes-' + jobId, JSON.stringify(s3Notes));
          
          updateNoteButtons(jobId, s3Notes);
        }
      } catch (e) {
        console.error("Error syncing notes from S3", e);
      }
    }

    async function saveJobNotes(jobId, notes) {
      localStorage.setItem('job-notes-' + jobId, JSON.stringify(notes));
      try {
        await fetch(`/ontology/jobs/${jobId}/notes`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(notes)
        });
      } catch (e) {
        console.error("Error saving notes to S3", e);
        M.toast({ html: 'Notes saved locally (failed to upload to S3)' });
      }
    }

    function openNotesModal(jobId, domain) {
      currentEditingJobId = jobId;
      document.getElementById('notes-modal-title').textContent = `Notes for ${domain}`;
      document.getElementById('notes-modal-input').value = '';
      
      const inputLabel = document.querySelector('label[for="notes-modal-input"]');
      if (inputLabel) {
        inputLabel.classList.remove('active');
      }
      
      renderNotesModalList();
      
      const modalInstance = M.Modal.getInstance(document.getElementById('notes-modal'));
      if (modalInstance) {
        modalInstance.open();
      }
      
      syncNotesFromS3(jobId).then(() => {
        renderNotesModalList();
      });
    }

    function renderNotesModalList() {
      const listContainer = document.getElementById('notes-modal-list');
      if (!listContainer) return;
      
      const notes = getJobNotes(currentEditingJobId);
      
      if (notes.length === 0) {
        listContainer.innerHTML = `
          <div class="review-notes-empty">
            No notes recorded for this run. Type a note below to get started.
          </div>
        `;
        return;
      }
      
      listContainer.innerHTML = '';
      notes.forEach(note => {
        const dateStr = new Date(note.timestamp).toLocaleString('en-GB', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          timeZone: 'Europe/London'
        });
        
        const noteEl = document.createElement('div');
        noteEl.className = 'review-note-item';
        
        noteEl.innerHTML = `
          <div class="review-note-item__meta">
            <span>${dateStr}</span>
          </div>
          <div class="review-note-item__text" id="note-text-${note.id}">${escapeHtml(note.text)}</div>
          <div class="review-note-item__actions">
            <button type="button" class="review-note-icon-button" onclick="editNoteItem('${note.id}')" title="Edit note" aria-label="Edit note">
              <i class="material-icons" aria-hidden="true">edit</i>
            </button>
            <button type="button" class="review-note-icon-button review-note-icon-button--danger" onclick="deleteNoteItem('${note.id}')" title="Delete note" aria-label="Delete note">
              <i class="material-icons" aria-hidden="true">delete</i>
            </button>
          </div>
        `;
        listContainer.appendChild(noteEl);
      });

      setTimeout(() => {
        listContainer.scrollTop = listContainer.scrollHeight;
      }, 50);
    }

    window.deleteNoteItem = function(noteId) {
      if (!confirm("Are you sure you want to delete this note?")) return;
      
      let notes = getJobNotes(currentEditingJobId);
      notes = notes.filter(n => n.id !== noteId);
      saveJobNotes(currentEditingJobId, notes).then(() => {
        renderNotesModalList();
        fetchJobs();
      });
    };

    window.editNoteItem = function(noteId) {
      const notes = getJobNotes(currentEditingJobId);
      const note = notes.find(n => n.id === noteId);
      if (!note) return;
      
      const newText = prompt("Edit note text:", note.text);
      if (newText === null) return;
      
      const trimmed = newText.trim();
      if (!trimmed) {
        window.deleteNoteItem(noteId);
        return;
      }
      
      note.text = trimmed;
      saveJobNotes(currentEditingJobId, notes).then(() => {
        renderNotesModalList();
        fetchJobs();
      });
    };

    document.getElementById('notes-modal-add-btn').addEventListener('click', () => {
      const textarea = document.getElementById('notes-modal-input');
      const text = textarea.value.trim();
      if (!text) return;
      
      const notes = getJobNotes(currentEditingJobId);
      notes.push({
        id: 'note-' + Date.now(),
        text: text,
        timestamp: new Date().toISOString()
      });
      
      saveJobNotes(currentEditingJobId, notes).then(() => {
        textarea.value = '';
        renderNotesModalList();
        fetchJobs();
      });
    });

    function renderJobsTable(jobs) {
      latestJobs = jobs || [];

      if (selectedJobId && !latestJobs.some(job => job.job_id === selectedJobId)) {
        selectedJobId = null;
      }

      if (!latestJobs.length) {
        jobsTbody.innerHTML = '<tr><td colspan="6" class="review-table-empty">No jobs found.</td></tr>';
        return;
      }

      jobsTbody.innerHTML = '';
      latestJobs.forEach(job => {
        const status = String(job.status || 'pending').toLowerCase();
        const domainStr = job.domain ? String(job.domain) : '-';
        const pipeline = job.pipeline || 'ontology';
        const isIngestion = pipeline === 'ingestion';
        const isHarness = pipeline === 'ontology-harness';
        const hasOutputArtifacts = Boolean(job.job_runs) && !isIngestion;
        const isSelected = selectedJobId === job.job_id;
        const ontologyLabel = job.job_runs ? `${job.job_runs} (${job.job_id})` : job.job_id;
        const typeLabel = pipelineTypeLabel(pipeline);
        const notesCount = getJobNotes(job.job_id).length;
        const canStop = ['pending', 'running'].includes(status);

        const tr = document.createElement('tr');
        tr.className = `review-job-row${isSelected ? ' is-selected' : ''}`;
        tr.dataset.jobId = job.job_id;
        tr.tabIndex = 0;
        tr.setAttribute('aria-expanded', isSelected ? 'true' : 'false');
        tr.innerHTML = `
          <td>
            <strong>${escapeHtml(ontologyLabel)}</strong>
          </td>
          <td>${escapeHtml(domainStr)}</td>
          <td>${formatDateTime(job.created_at)}</td>
          <td>
            <span class="govuk-tag review-tag govuk-tag--${statusTagModifier(status)}">${escapeHtml(jobStatusLabel(job))}</span>
          </td>
          <td>
            <span class="govuk-tag review-tag govuk-tag--${pipelineTagModifier(pipeline)}">${escapeHtml(typeLabel)}</span>
          </td>
          <td>
            ${renderRowActions(canStop, job, domainStr, notesCount)}
          </td>
        `;
        jobsTbody.appendChild(tr);

        if (isSelected) {
          const detailTr = document.createElement('tr');
          detailTr.className = 'review-detail-row';
          detailTr.innerHTML = `<td colspan="6">${renderJobDetail(job, { domainStr, isHarness, hasOutputArtifacts, status })}</td>`;
          jobsTbody.appendChild(detailTr);
        }

        syncNotesFromS3(job.job_id);
      });

      M.Tooltip.init(document.querySelectorAll('.tooltipped'));
    }

    function renderJobDetail(job, context) {
      const { domainStr, isHarness, hasOutputArtifacts, status } = context;
      const notes = getJobNotes(job.job_id);
      const notesCount = notes.length;
      const targetBucket = 'govuk-ai-accelerator-data-integration';
      const encodedDomain = encodeURIComponent(domainStr);
      const encodedRun = encodeURIComponent(job.job_runs || '');
      const runPath = `${domainStr}/${job.job_runs || ''}`;
      const encodedRunPath = encodeURIComponent(runPath);
      const canStop = ['pending', 'running'].includes(status);
      const latestNote = notesCount > 0 ? notes[notesCount - 1].text : '';

      const visualiserLink = hasOutputArtifacts
        ? `/visualizer/?run=${encodedRunPath}`
        : '';
      const graphDownloadLink = hasOutputArtifacts
        ? `/viewer/bucket/download/buckets/${targetBucket}/${encodedDomain}/${encodedRun}/output/graph.json`
        : '';
      const ttlDownloadLink = hasOutputArtifacts
        ? `/viewer/bucket/download/buckets/${targetBucket}/${encodedDomain}/${encodedRun}/output/ontology.ttl`
        : '';
      const outputLink = hasOutputArtifacts
        ? `/viewer/bucket/${targetBucket}/${encodedDomain}/${encodedRun}/`
        : '';
      const reportLink = hasOutputArtifacts && isHarness
        ? `/viewer/bucket/download/buckets/${targetBucket}/${encodedDomain}/${encodedRun}/output/regression_report.json`
        : '';

      return `
        <div class="review-job-detail">
          <div class="review-detail-menu" aria-label="Selected job menu">
            ${renderDetailTab('ontology-files', 'Ontology Files')}
            ${renderDetailTab('intermediary-files', 'Intermediary Files')}
            ${renderDetailTab('reports', 'Reports')}
            ${renderDetailTab('notes', 'Notes')}
          </div>
          <div class="review-detail-panel">
            ${selectedDetailSection === 'notes'
              ? renderNotesDetail(job, domainStr, notesCount, latestNote)
              : selectedDetailSection === 'reports'
                ? renderReportsDetail(reportLink, hasOutputArtifacts, isHarness)
              : selectedDetailSection === 'intermediary-files'
                ? renderIntermediaryFilesDetail(outputLink, hasOutputArtifacts)
                : renderOntologyFilesDetail(visualiserLink, graphDownloadLink, ttlDownloadLink, hasOutputArtifacts)}
          </div>
        </div>
      `;
    }

    function renderDetailTab(section, label) {
      const active = selectedDetailSection === section;
      return `
        <button type="button" class="review-detail-tab${active ? ' is-active' : ''}" data-detail-section="${section}">
          ${label}
        </button>
      `;
    }

    function renderArtifactLink(label, href, meta) {
      if (!href) return '';
      return `
        <a class="review-artifact-link" href="${href}" target="_blank" rel="noopener noreferrer">
          <span>${label}</span>
          <span>${meta}</span>
        </a>
      `;
    }

    function renderUnavailableArtifacts() {
      return '<p class="review-empty-state">No generated artefacts are available for this job yet.</p>';
    }

    function renderRowActions(canStop, job, domainStr, notesCount) {
      const notesLabel = notesCount > 0 ? `View notes (${notesCount})` : 'Add note';
      return `
        <div class="review-row-actions" aria-label="Actions for ${escapeAttribute(job.job_id)}">
          <button type="button" class="govuk-button govuk-button--secondary review-row-action edit-note-action" data-job-id="${escapeAttribute(job.job_id)}" data-domain="${escapeAttribute(domainStr)}" aria-label="${notesLabel} for ${escapeAttribute(domainStr)}">
            <span class="notes-count">${notesLabel}</span>
          </button>
          ${canStop ? `
            <button type="button" class="govuk-button govuk-button--warning review-row-action stop-job-action" data-job-id="${escapeAttribute(job.job_id)}">
              Stop job<span class="govuk-visually-hidden"> ${escapeHtml(job.job_id)}</span>
            </button>
          ` : ''}
        </div>
      `;
    }

    function renderOntologyFilesDetail(visualiserLink, graphDownloadLink, ttlDownloadLink, hasOutputArtifacts) {
      return `
        <div class="review-detail-content">
          <h3>Ontology Files</h3>
          ${hasOutputArtifacts ? `
            <div class="review-artifact-list">
              ${renderArtifactLink('Graph', visualiserLink, 'view')}
              ${renderArtifactLink('Graph', graphDownloadLink, 'download')}
              ${renderArtifactLink('Ontology .TTL', ttlDownloadLink, 'download')}
            </div>
          ` : renderUnavailableArtifacts()}
        </div>
      `;
    }

    function renderReportsDetail(reportLink, hasOutputArtifacts, isHarness) {
      const hasReport = Boolean(reportLink);
      return `
        <div class="review-detail-content">
          <h3>Reports</h3>
          ${hasReport ? `
            <div class="review-artifact-list">
              ${renderArtifactLink('Regression report', reportLink, 'download')}
            </div>
          ` : `<p class="review-empty-state">${hasOutputArtifacts && !isHarness
              ? 'No reports are available for this ontology run.'
              : 'No reports are available for this job yet.'}</p>`}
        </div>
      `;
    }

    function renderIntermediaryFilesDetail(outputLink, hasOutputArtifacts) {
      return `
        <div class="review-detail-content">
          <h3>Intermediary Files</h3>
          ${hasOutputArtifacts ? `
            <div class="review-artifact-list">
              ${renderArtifactLink('Output folder', outputLink, 'browse files')}
            </div>
          ` : renderUnavailableArtifacts()}
        </div>
      `;
    }

    function renderNotesDetail(job, domainStr, notesCount, latestNote) {
      const notesLabel = notesCount > 0 ? `View notes (${notesCount})` : 'Add note';
      return `
        <div class="review-detail-content">
          <h3>Notes</h3>
          <p class="review-note-summary">${notesCount > 0 ? escapeHtml(latestNote) : 'No notes recorded for this run.'}</p>
          <button type="button" class="govuk-button govuk-button--secondary review-notes-action edit-note-action" data-job-id="${escapeAttribute(job.job_id)}" data-domain="${escapeAttribute(domainStr)}" aria-label="${notesLabel} for this job">
            <span class="notes-count">${notesLabel}</span>
          </button>
        </div>
      `;
    }

    async function stopJob(jobId, button) {
      if (!window.confirm(`Stop job ${jobId}?`)) return;

      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
      button.innerHTML = `Stopping<span class="govuk-visually-hidden"> job ${jobId}</span>`;

      try {
        const response = await fetch(`/ontology/jobs/${jobId}/stop`, { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || 'Failed to stop job');
        }
        M.toast({ html: `Job ${jobId} stopped` });
        fetchJobs();
      } catch (err) {
        M.toast({ html: `Could not stop job: ${err.message}` });
        button.disabled = false;
        button.removeAttribute('aria-disabled');
        button.innerHTML = `Stop job<span class="govuk-visually-hidden"> ${jobId}</span>`;
      }
    }

    jobsTbody.addEventListener('click', (event) => {
      const stopButton = event.target.closest('.stop-job-action');
      if (stopButton) {
        stopJob(stopButton.dataset.jobId, stopButton);
        return;
      }

      const noteButton = event.target.closest('.edit-note-action');
      if (noteButton) {
        const jobId = noteButton.dataset.jobId;
        const domain = noteButton.dataset.domain;
        openNotesModal(jobId, domain);
        return;
      }

      const detailTab = event.target.closest('.review-detail-tab');
      if (detailTab) {
        selectedDetailSection = detailTab.dataset.detailSection;
        renderJobsTable(filterJobs());
        return;
      }

      const jobRow = event.target.closest('.review-job-row');
      if (jobRow) {
        selectedJobId = selectedJobId === jobRow.dataset.jobId ? null : jobRow.dataset.jobId;
        selectedDetailSection = 'ontology-files';
        renderJobsTable(filterJobs());
      }
    });

    jobsTbody.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;

      const jobRow = event.target.closest('.review-job-row');
      if (!jobRow) return;

      event.preventDefault();
      selectedJobId = selectedJobId === jobRow.dataset.jobId ? null : jobRow.dataset.jobId;
      selectedDetailSection = 'ontology-files';
      renderJobsTable(filterJobs());
    });

    jobsSearch.addEventListener('input', () => renderJobsTable(filterJobs()));
    refreshBtn.addEventListener('click', fetchJobs);
    fetchJobs();
    setInterval(fetchJobs, 30000); // Slower refresh for historical view
  });
</script>
<style>
  .review-jobs-page {
      width: 100%;
  }

  .review-jobs-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 24px;
  }

  .review-jobs-header h2 {
      margin: 0 0 10px;
      color: #0b0c0c;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
  }

  .review-jobs-header p {
      margin: 0;
      color: #505a5f;
      font-size: 17px;
      line-height: 1.45;
  }

  .review-icon-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #0b0c0c;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
  }

  .review-icon-button:hover {
      background: #f3f2f1;
  }

  .review-icon-button:focus,
  .review-detail-tab:focus,
  .review-notes-action:focus,
  .review-row-action:focus,
  .review-modal-close:focus,
  .review-note-icon-button:focus {
      outline: 3px solid #ffdd00;
      outline-offset: 0;
      box-shadow: 0 4px #0b0c0c;
