name: Deploy

run-name: Deploy ${{ inputs.gitRef || github.event.release.tag_name  }} to ${{ inputs.environment || 'integration' }}

on:
  workflow_dispatch:
    secrets:
        GOVUK_CI_GITHUB_API_TOKEN:
          description: 'GitHub API token passed from the caller workflow'
          required: true
    inputs:
      gitRef:
        description: 'Commit, tag or branch name to deploy'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
        - integration
        default: 'integration'
  release:
    types: [released]

jobs:
  resolve-ontology-harness-generator:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    name: Resolve ontology harness generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      generator_sha: ${{ steps.generator.outputs.generator_sha }}
      deployment_id: ${{ steps.generator.outputs.deployment_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: alphagov/govuk-ai-accelerator-tw-accelerator
        ref: main
        token: ${{ secrets.GOVUK_CI_GITHUB_API_TOKEN }}
        path: generator
        fetch-depth: 0

    - id: generator
      run: |
        generator_sha="$(git -C generator rev-parse HEAD)"
        deployment_id="tw-accelerator-${generator_sha}"
        echo "generator_sha=${generator_sha}" >> "$GITHUB_OUTPUT"
        echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"

  build-and-publish-image:
    needs: resolve-ontology-harness-generator
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    name: Build and publish image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: alphagov/govuk-infrastructure/.github/workflows/build-push-arm-image.yml@main
    with:
      gitRef: ${{ inputs.gitRef || github.event.release.tag_name }}
      buildArgs: |
        GENERATOR_GIT_REF=${{ needs.resolve-ontology-harness-generator.outputs.generator_sha }}
        ONTOLOGY_HARNESS_ENABLED=true
        ONTOLOGY_HARNESS_DEPLOYMENT_ID=${{ needs.resolve-ontology-harness-generator.outputs.deployment_id }}
    secrets:
      BUILD_SECRETS: |
        "GITHUB_TOKEN=${{ secrets.GOVUK_CI_GITHUB_API_TOKEN }}"
        
  trigger-deploy:
    name: Trigger deploy to ${{ inputs.environment || 'integration' }}
    needs: build-and-publish-image
    uses: alphagov/govuk-infrastructure/.github/workflows/deploy.yml@main
    with:
      imageTag: ${{ needs.build-and-publish-image.outputs.imageTag }}
      environment: ${{ inputs.environment || 'integration' }}
    secrets:
      WEBHOOK_TOKEN: ${{ secrets.GOVUK_ARGO_EVENTS_WEBHOOK_TOKEN }}
      WEBHOOK_URL: ${{ secrets.GOVUK_ARGO_EVENTS_WEBHOOK_URL }}
      GH_TOKEN: ${{ secrets.GOVUK_CI_GITHUB_API_TOKEN }}
